/* LOGO IMAGE & BOUNCE EFFECT */
.logo {
  width: 50px;
  height: 50px;

  overflow: hidden;
  border: 2px solid rgba(255,180,0,0.3);

}

.logo-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

@keyframes logoGlow {
  from {
    box-shadow: 0 0 10px rgba(255,180,0,0.1), inset 0 0 5px rgba(255,180,0,0.05);
    border-color: rgba(255,180,0,0.2);
  }
  to {
    box-shadow: 0 0 30px rgba(255,180,0,0.4), inset 0 0 10px rgba(255,180,0,0.2);
    border-color: rgba(255,180,0,0.6);
  }
}

@keyframes logoBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

/* NAME GLOW */
.info h4 {
  margin: 0;
  font-size: 24px;
  font-weight: 600;
  color: #ffb400;
  text-shadow: 0 0 20px rgba(255,180,0,0.4);
}

/* TYPING EFFECT */
.info p {
  margin: 6px 0 0;
  font-size: 14px;
  color: #888;
  white-space: nowrap;
  overflow: hidden;
  border-right: 2px solid #ffb400;
  width: 0;
  animation: typing 3s steps(25) forwards, blink 0.8s infinite;
}

@keyframes typing { to { width: 100%; } }
@keyframes blink { 50% { border-color: transparent; } }

/* SHINING LINKS (BUTTONS) */
.btn {
  display: flex;
  align-items: center;

  font-weight: 500;
  background: rgba(255, 255, 255, 0.03);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 180, 0, 0.15);
  transition: all 0.4s ease;
  position: relative;
  animation: btnPulse 4s ease-in-out infinite alternate;
}

@keyframes btnPulse {
  from {
    border-color: rgba(255, 180, 0, 0.1);
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }
  to {
    border-color: rgba(255, 180, 0, 0.3);
    box-shadow: 0 0 20px rgba(255, 180, 0, 0.15);
  }
}

.btn:hover {

.icon {

}
